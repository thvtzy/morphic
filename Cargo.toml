[package]
name = "morphic"
version = "0.1.0"
edition = "2021"
description = "Self-Synthesizing Programming Language — write specs, not implementations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thvtzy/morphic"

[[bin]]
name = "morphic"
path = "src/main.rs"

[features]
default = []
llm-remote = ["reqwest", "tokio"]
llm-local = ["llama-cpp-2"]
z3-support = ["z3"]

[dependencies]
# Parsing
logos = "0.15"
chumsky = "1"

# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "2"
indicatif = "0.17"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Search & data structures
petgraph = "0.7"
rand = "0.8"
rayon = "1.10"
dashmap = "6"
slotmap = "1"

# Formal verification (optional — requires Z3 4.12+ installed on system)
z3 = { version = "0.6", optional = true }

# LLM backends (optional — enable via features)
llama-cpp-2 = { version = "0.1", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
itertools = "0.14"

# Remove RUSTFLAGS warning for unused imports during development
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
