[package]
name = "morphic"
version = "0.4.0"
edition = "2021"
description = "Self-Synthesizing Programming Language — write specs, not implementations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thvtzy/morphic"

[[bin]]
name = "morphic"
path = "src/main.rs"

[features]
default = ["z3-support"]
llm-remote = ["tokio"]
llm-local = ["llama-cpp-2"]
z3-support = ["z3", "z3/gh-release"]

[dependencies]
# CLI & error handling
clap = { version = "4.5", features = ["derive"] }
colored = "2"
indicatif = "0.17"
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrency
rayon = "1.10"
rand = "0.8"

# HTTP client (Ollama + optional remote LLM)
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Formal verification (v0.2: bundled Z3 via z3 crate FFI)
z3 = { version = "0.20", optional = true, features = ["gh-release"] }

# LLM backends (optional — enable via features)
llama-cpp-2 = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
