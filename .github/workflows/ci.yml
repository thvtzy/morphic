name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

      # The 1.7 catalog consistency instrument
      # (DISEBAR_17_SCOPE §9, wired at Phase 166): the
      # shipped binary against the repo's own registry/ —
      # for every index entry, the file exists, its
      # sha256 matches the row, and its claim reproduces
      # under `registry verify`'s sweep (the ledger below
      # is staged from the bundles' own claims, so the
      # sweep is the claim-vs-reproduction comparison).
      # A catalog PR that adds a lying or stale bundle
      # fails here, before merge.
      # The binary is built for this step from the
      # compiler package alone: the workspace test build
      # above unifies features across members, and the
      # morphic-wasm member turns `wasm-playground` on
      # for the shared bin artifact — a build whose
      # registry surface is compiled out by design. The
      # shipped binary is the package's own.
      - name: Registry catalog consistency
        run: |
          set -euo pipefail
          cargo build -p morphic --bin morphic
          BIN="$PWD/target/debug/morphic"
          WORK="$RUNNER_TEMP/morphic-catalog-consistency"
          rm -rf "$WORK"
          mkdir -p "$WORK/install"
          python3 - "$WORK/install" <<'PY'
          import hashlib, json, pathlib, sys
          install = pathlib.Path(sys.argv[1])
          index = json.loads(pathlib.Path("registry/index.json").read_text())
          rows = []
          for row in index["entries"]:
              path = pathlib.Path(row["file"])
              assert path.exists(), f"{row['entry']}: catalogued file missing"
              data = path.read_bytes()
              assert len(data) == row["bytes"], f"{row['entry']}: bytes differ from the row"
              digest = hashlib.sha256(data).hexdigest()
              assert digest == row["sha256"], f"{row['entry']}: sha256 differs from the row"
              bundle = json.loads(data)
              (install / f"{row['entry']}.bundle.json").write_bytes(data)
              rows.append({
                  "entry": row["entry"],
                  "version": row["version"],
                  "sha256": digest,
                  "tier": bundle["tier"],
                  "verdictBasis": bundle["verdictBasis"],
                  "verdict": bundle["verdict"],
                  "crownRoute": bundle["crownRoute"],
                  "battery": bundle["battery"],
                  "index": "ci catalog consistency (DISEBAR_17_SCOPE §9)",
                  "installed": "1970-01-01",
              })
          rows.sort(key=lambda r: r["entry"])
          ledger = {"format": "morphic-registry-ledger", "entries": rows}
          (install / "installed.json").write_text(json.dumps(ledger, indent=2) + "\n")
          print(f"catalog consistency: {len(rows)} entries staged for the sweep")
          PY
          MORPHIC_REGISTRY_DIR="$WORK/install" "$BIN" registry verify

      # The 1.6 component pipeline (DISEBAR_16_SCOPE §3,
      # wired at Phase 161): the same pinned tarballs,
      # the same target, plain cargo — then the fresh
      # library build answers one battery point through
      # the pinned wasmtime and the fresh callback
      # build's printed world carries its frozen
      # imports. (Byte-for-byte reproduction against
      # the committed artifacts of record is the
      # sandbox gate instrument's pin; CI's rustc is
      # the runner's stable, not the sandbox's.)
      - name: Components (pinned tools, plain cargo)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/morphic-tools"
          mkdir -p "$TOOLS"
          curl -fsSL -o "$TOOLS/wasm-tools.tar.gz" \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.263.0/wasm-tools-1.263.0-x86_64-linux.tar.gz
          echo "21c036c1740a0552124c79c6e2170cb61c5b016005671a6d5bc06cf642165431  $TOOLS/wasm-tools.tar.gz" | sha256sum -c -
          tar -xzf "$TOOLS/wasm-tools.tar.gz" -C "$TOOLS"
          curl -fsSL -o "$TOOLS/wasmtime.tar.xz" \
            https://github.com/bytecodealliance/wasmtime/releases/download/v51.0.0/wasmtime-v51.0.0-x86_64-linux.tar.xz
          echo "a18020674fac4107f329bc9ed720ea9c88e4b30a61e8a527787bcce051123d32  $TOOLS/wasmtime.tar.xz" | sha256sum -c -
          tar -xJf "$TOOLS/wasmtime.tar.xz" -C "$TOOLS"
          WASM_TOOLS="$TOOLS/wasm-tools-1.263.0-x86_64-linux/wasm-tools"
          WASMTIME="$TOOLS/wasmtime-v51.0.0-x86_64-linux/wasmtime"
          "$WASM_TOOLS" --version
          "$WASMTIME" --version
          rustup target add wasm32-wasip2
          (cd packages/component && cargo build --target wasm32-wasip2 --release)
          (cd packages/component-callbacks && cargo build --target wasm32-wasip2 --release)
          LIB=packages/component/target/wasm32-wasip2/release/morphic_component.wasm
          CB=packages/component-callbacks/target/wasm32-wasip2/release/morphic_component_callbacks.wasm
          test "$("$WASMTIME" run --invoke 'int-clamp(15, 0, 10)' "$LIB")" = "10"
          "$WASM_TOOLS" component wit "$CB" | grep -q 'import map-apply: func(x: s64) -> s64;'
          "$WASM_TOOLS" component wit "$LIB" | grep -q 'export morphic:library/functions'
