name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: morphic
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: morphic.exe

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary }} dist/
          cp README.md dist/
          cp LICENSE-MIT dist/
          cp LICENSE-APACHE dist/

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar -czf ../morphic-${{ matrix.target }}.tar.gz *

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath morphic-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: morphic-${{ matrix.target }}
          path: morphic-${{ matrix.target }}.*

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: morphic-*
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          name: "Morphic v${{ github.ref_name }}"
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
